# 如影 AI 能力开放平台 —— 新服务器 116.181.19.193 反向代理
# 产品地址：http://116.181.19.193/digital-human/
# 代理去掉 /digital-human/ 前缀转发，因此服务端不需要设置 PUBLIC_BASE_PATH。
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location = / { return 301 /digital-human/; }
    location = /digital-human { return 301 /digital-human/; }

    location /digital-human/ {
        proxy_pass http://experience:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
